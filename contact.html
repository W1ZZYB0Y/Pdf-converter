<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        form { margin-top: 20px; }
        label { display: block; margin: 15px 0 5px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    
   <form action="https://formspree.io/f/xrbpjlvp" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
  
   <label for="email">Email:</label>
   <input type="email" id="email" name="_replyto" required>
  
    <label for="message">Message:</label>
   <textarea id="message" name="message" rows="5" required></textarea>
  
  <!-- Honeypot (spam prevention) -->
    <input type="text" name="_gotcha" style="display:none">
  
  <!-- Redirect after submission -->
    <input type="hidden" name="_next" value="https://w1zzyb0y.github.io/Pdf-convert/thank-you.html">
  
    <button type="submit">Send Message</button>
  </form>
</body>
</html>
